<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake News Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>📰 Fake News Detector</h1>
    <p class="subtitle">Enter a headline or article text to evaluate whether it is authentic or fabricated.</p>

    <textarea id="newsInput" placeholder="Paste article content or news headline here..."></textarea>
    
    <div class="button-group">
      <button id="analyzeBtn" onclick="analyzeNews()">Analyze Text</button>
      <button id="clearBtn" onclick="clearInput()">Clear</button>
    </div>

    <div id="resultBox" class="result-card hidden">
      <div id="badge" class="badge"></div>
      <div id="resultExplanation" class="result-text"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
